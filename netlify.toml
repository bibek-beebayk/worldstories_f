[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  VITE_GA_MEASUREMENT_ID = "G-BQ2MC1QBFR"

[[redirects]]
  from = "/sitemap.xml"
  to = "https://worldstories-b-production.up.railway.app/api/sitemap.xml"
  status = 200
  force = true

# /catalogue was renamed to /library; no in-app route exists for the old
# path, so this stays a CDN-level redirect for old links/bookmarks/indexed
# search results instead of letting them 404.
[[redirects]]
  from = "/catalogue"
  to = "/library"
  status = 301
  force = true

# Everything else that used to need a "serve the SPA shell, let client-side
# routing sort it out" redirect here is now handled directly by the SSR
# function itself — every route in src/routes.ts (including the /trending →
# /discover redirect, now a real 301 from its own loader) resolves server-side
# with the correct status. No catch-all fallback needed.
