<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title description">
  <title id="title">WorldStories fallback book cover</title>
  <desc id="description">A decorative book cover used when a story has no available cover image.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18243b"/>
      <stop offset="0.55" stop-color="#263a5c"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#background)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  <rect x="42" y="42" width="516" height="816" rx="18" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3"/>
  <path d="M180 330c50-22 90-12 120 18v230c-30-30-70-40-120-18V330Zm240 0c-50-22-90-12-120 18v230c30-30 70-40 120-18V330Z" fill="none" stroke="#7dd3fc" stroke-width="14" stroke-linejoin="round"/>
  <path d="M300 348v230" stroke="#7dd3fc" stroke-width="8"/>
  <text x="300" y="680" fill="#fff" font-family="Georgia, serif" font-size="44" font-weight="700" text-anchor="middle">WorldStories</text>
  <text x="300" y="727" fill="#fff" fill-opacity=".62" font-family="Arial, sans-serif" font-size="20" letter-spacing="5" text-anchor="middle">STORY COVER</text>
</svg>
