<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldStories - Home of Stories</title>
    <meta name="description" content="WorldStories is the home for stories from around the world. Discover new tales, connect with authors, and immerse yourself in diverse narratives across genres." />
    <meta name="author" content="WorldStories" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://worldstories.net/" />
    <link rel="icon" href="/worldstories-logo-min.png" type="image/png" />

    <!-- PWA: vite-plugin-pwa injects the manifest link + SW registration
         script at build time. iOS Safari doesn't read the manifest for these,
         so they're set explicitly here. -->
    <meta name="theme-color" content="#ED405A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WorldStories" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Open-source metric equivalents for the reader's font picker (Georgia/Times/Garamond/Helvetica
         aren't installed on most non-Mac/Windows systems, so without these the font choices silently
         collapse to whatever generic serif/sans-serif the browser falls back to). -->
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Gelasio:ital,wght@0,400;0,700;1,400&family=Tinos:ital,wght@0,400;0,700;1,400&family=Arimo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://pub-17e5aea668624aa283be17aed25d6471.r2.dev">
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>

    <meta property="og:title" content="WorldStories - Home of Stories" />
    <meta property="og:description" content="WorldStories is the home for stories from around the world. Discover new tales, connect with authors, and immerse yourself in diverse narratives across genres." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WorldStories" />
    <meta property="og:url" content="https://worldstories.net/" />
    <meta property="og:image" content="https://worldstories.net/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WorldStories - Home of Stories" />
    <meta name="twitter:description" content="Discover stories and diverse voices from around the world." />
    <meta name="twitter:image" content="https://worldstories.net/og-image.png" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "WorldStories",
            "url": "https://worldstories.net",
            "logo": "https://worldstories.net/worldstories-mark.svg"
          },
          {
            "@type": "WebSite",
            "name": "WorldStories",
            "url": "https://worldstories.net",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://worldstories.net/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
